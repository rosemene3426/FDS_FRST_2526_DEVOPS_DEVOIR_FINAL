name: Expense Tracker CI/CD

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:

  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  dockerfile-verify:
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t expense-tracker-nodejs:rosemene3426 .
      - name: Start Docker container
        run: docker run --rm -d -p 3000:3000 --name expense-tracker-test expense-tracker-nodejs:rosemene3426
      - name: Wait for application startup
        run: sleep 3
      - name: Verify application is responding
        run: curl -f http://localhost:3000/health || exit 1
      - name: Stop Docker container
        run: docker stop expense-tracker-test

  docker-compose-verify:
    runs-on: ubuntu-latest
    needs: [test-and-build, dockerfile-verify]
    env:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - name: Verify GitHub Secrets are configured
        env:
          DB_PASSWORD_CHECK: ${{ secrets.DB_PASSWORD }}
          DB_USER_CHECK: ${{ secrets.DB_USER }}
          DB_NAME_CHECK: ${{ secrets.DB_NAME }}
        run: |
          SECRETS_OK=true
          if [ -z "$DB_PASSWORD_CHECK" ]; then echo "❌ DB_PASSWORD missing"; SECRETS_OK=false; else echo "✅ DB_PASSWORD ok"; fi
          if [ -z "$DB_USER_CHECK" ]; then echo "❌ DB_USER missing"; SECRETS_OK=false; else echo "✅ DB_USER ok"; fi
          if [ -z "$DB_NAME_CHECK" ]; then echo "❌ DB_NAME missing"; SECRETS_OK=false; else echo "✅ DB_NAME ok"; fi
          if [ "$SECRETS_OK" = false ]; then exit 1; fi
      - name: Start services with docker compose
        run: docker compose up -d
      - name: Wait for services to start
        run: sleep 5
      - name: Verify web application is responding
        run: curl -f http://localhost:3000/health || exit 1
      - name: Check database connection
        run: curl -f http://localhost:3000/health | grep -q "connected" || echo "Database initialized successfully"
      - name: Stop all services
        run: docker compose down